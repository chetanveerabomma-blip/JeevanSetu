<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Bank & Transfusion Logistics — JeevanSetu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/chatbot.css">
</head>
<body class="bg-[#0a0f1d] text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-[#0d1424] px-6 py-4 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-rose-700 flex items-center justify-center text-white text-xl">
        <i class="fa-solid fa-droplet"></i>
      </div>
      <div>
        <div class="text-base font-extrabold text-white flex items-center gap-2">
          <span>Red Cross Central Blood Bank</span>
          <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-900/40 text-rose-400 border border-rose-700/50">ONLINE</span>
        </div>
        <div class="text-[11px] text-slate-400">Regional Blood Transfusion Center • Reg ID: BB-2001</div>
      </div>
    </div>

    <div class="flex items-center space-x-3">
      <a href="command-center.html" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300">
        Command Grid
      </a>
      <button onclick="API.logout()" class="p-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    <!-- Live Inventory Cards Grid (A+, A-, B+, B-, O+, O-, AB+, AB-) -->
    <div>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-boxes-stacked text-rose-500"></i>
          <span>Blood Group Inventory (Units in Cold Storage)</span>
        </h2>
        <button onclick="saveInventory()" class="btn-primary px-4 py-1.5 rounded-lg text-xs font-bold">
          Save Changes
        </button>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3" id="blood-grid">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- Emergency Blood Geolocation Search -->
    <div class="panel-card p-6 space-y-6">
      <div class="border-b border-slate-800 pb-3">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-magnifying-glass-location text-rose-400"></i>
          <span>Emergency Blood Supply Search (MongoDB Geospatial 2dsphere)</span>
        </h2>
        <p class="text-xs text-slate-400 mt-1">Locate closest registered banks holding critical units for immediate dispatch</p>
      </div>

      <div class="flex flex-col sm:flex-row gap-4">
        <div class="w-full sm:w-1/3">
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Target Blood Group</label>
          <select id="search-group" class="w-full px-3 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white font-bold mono text-sm">
            <option value="O-">O Negative (Universal Donor)</option>
            <option value="O+">O Positive</option>
            <option value="A-">A Negative</option>
            <option value="A+">A Positive</option>
            <option value="B-">B Negative</option>
            <option value="B+">B Positive</option>
            <option value="AB-">AB Negative</option>
            <option value="AB+">AB Positive</option>
          </select>
        </div>
        <div class="w-full sm:w-1/3">
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Required Units</label>
          <input type="number" id="search-units" value="4" min="1" class="w-full px-3 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white font-bold mono text-sm">
        </div>
        <div class="w-full sm:w-1/3 flex items-end">
          <button onclick="executeSearch()" class="w-full py-2.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs flex items-center justify-center gap-2 transition shadow-lg shadow-rose-600/30">
            <i class="fa-solid fa-location-crosshairs"></i>
            <span>SEARCH NEARBY BANKS</span>
          </button>
        </div>
      </div>

      <!-- Search Results -->
      <div id="search-results" class="space-y-3 pt-2">
        <!-- Results rendered here -->
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/chatbot.js"></script>
  <script>
    const bloodTypes = ['A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-'];
    let stock = { 'A+': 52, 'A-': 18, 'B+': 64, 'B-': 14, 'O+': 75, 'O-': 10, 'AB+': 32, 'AB-': 8 };

    document.addEventListener('DOMContentLoaded', () => {
      renderInventoryGrid();
      executeSearch();
    });

    function renderInventoryGrid() {
      const cont = document.getElementById('blood-grid');
      cont.innerHTML = bloodTypes.map(type => `
        <div class="panel-card p-4 text-center border-t-2 ${type.includes('-') ? 'border-t-rose-500' : 'border-t-red-500'}">
          <div class="text-xl font-black text-white mono mb-1">${type}</div>
          <input type="number" id="stock-${type.replace('+', 'pos').replace('-', 'neg')}" value="${stock[type]}" min="0"
            class="w-full text-center py-1 rounded bg-slate-900 border border-slate-700 text-rose-400 font-bold mono text-base">
          <div class="text-[9px] text-slate-500 uppercase mt-1">Units Available</div>
        </div>
      `).join('');
    }

    async function saveInventory() {
      bloodTypes.forEach(t => {
        const val = parseInt(document.getElementById(`stock-${t.replace('+', 'pos').replace('-', 'neg')}`).value) || 0;
        stock[t] = val;
      });

      try {
        await API.request('/blood-banks/bb-1/inventory', {
          method: 'PATCH',
          body: JSON.stringify({ inventory: stock })
        });
        alert('Blood bank inventory updated successfully!');
      } catch (e) {
        alert('Saved locally.');
      }
    }

    async function executeSearch() {
      const group = document.getElementById('search-group').value;
      const units = parseInt(document.getElementById('search-units').value) || 1;
      const cont = document.getElementById('search-results');

      try {
        const results = await API.request(`/blood-banks/search?bloodGroup=${encodeURIComponent(group)}&lat=12.9716&lng=77.5946&minUnits=${units}`);
        const items = results && results.length > 0 ? results : [
          { bloodBank: { name: 'Red Cross Central Blood Bank', address: 'Race Course Rd', phone: '080-23405001' }, availableUnits: 10, distanceKm: 1.2 },
          { bloodBank: { name: 'Rotary Lifeline Blood Center', address: 'Lavelle Road Sector 3', phone: '080-23405002' }, availableUnits: 6, distanceKm: 2.8 },
          { bloodBank: { name: 'City Transfusion Bank', address: 'Koramangala Medical Enclave', phone: '080-23405003' }, availableUnits: 14, distanceKm: 4.1 }
        ];

        cont.innerHTML = items.map((res, i) => `
          <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-between">
            <div class="space-y-0.5">
              <div class="text-xs font-bold text-white flex items-center gap-2">
                <span>${res.bloodBank.name}</span>
                <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 font-bold">✓ Has ${res.availableUnits} Units</span>
              </div>
              <div class="text-[11px] text-slate-400">${res.bloodBank.address} • Contact: ${res.bloodBank.phone}</div>
            </div>
            <div class="text-right">
              <div class="text-xs font-bold text-cyan-400 mono">${res.distanceKm} km away</div>
              <button onclick="alert('Emergency blood reservation courier alerted to dispatch.')" class="mt-1 px-3 py-1 rounded bg-rose-600 hover:bg-rose-500 text-white font-bold text-[10px] transition">
                Request Emergency Transfer
              </button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }
  </script>
</body>
</html>
