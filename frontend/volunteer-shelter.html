<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteers & Disaster Shelters — JeevanSetu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#0a0f1d] text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-[#0d1424] px-6 py-4 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-amber-600 flex items-center justify-center text-white text-xl">
        <i class="fa-solid fa-person-shelter"></i>
      </div>
      <div>
        <div class="text-base font-extrabold text-white flex items-center gap-2">
          <span>Civil Protection, Volunteers & Shelters</span>
          <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-900/40 text-amber-400 border border-amber-700/50">DISASTER READY</span>
        </div>
        <div class="text-[11px] text-slate-400">Community Mobilization & Disaster Evacuation Grid</div>
      </div>
    </div>

    <div class="flex items-center space-x-3">
      <a href="command-center.html" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300">
        Command Grid
      </a>
      <button onclick="API.logout()" class="p-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
    <!-- Shelters Module -->
    <div class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-house-chimney-medical text-amber-400"></i>
          <span>Disaster Relief Shelters</span>
        </h2>
        <span class="text-xs text-slate-400">Capacity & Occupancy Tracking</span>
      </div>

      <div class="space-y-3" id="shelter-container">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- Volunteers Module -->
    <div class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-hand-holding-heart text-purple-400"></i>
          <span>Certified Community Volunteers</span>
        </h2>
        <span class="text-xs text-emerald-400 font-bold">● Non-Hazard Assistance Only</span>
      </div>

      <div class="space-y-3" id="volunteer-container">
        <!-- Generated by JS -->
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadShelters();
      loadVolunteers();
    });

    async function loadShelters() {
      const cont = document.getElementById('shelter-container');
      try {
        const shelters = await API.request('/volunteers-shelters/shelters');
        cont.innerHTML = (shelters || []).map(s => {
          const avail = s.totalCapacity - s.occupiedCapacity;
          const pct = Math.round((s.occupiedCapacity / s.totalCapacity) * 100);

          return `
            <div class="panel-card p-5 space-y-3">
              <div class="flex items-center justify-between">
                <div>
                  <div class="text-sm font-bold text-white">${s.name}</div>
                  <div class="text-xs text-slate-400">${s.address}</div>
                </div>
                <span class="px-2.5 py-1 rounded text-xs font-bold ${s.status === 'OPEN' ? 'badge-available' : 'badge-busy'}">${s.status}</span>
              </div>

              <div>
                <div class="flex justify-between text-xs mb-1">
                  <span class="text-slate-400">Occupancy: ${s.occupiedCapacity} / ${s.totalCapacity} (${pct}%)</span>
                  <span class="font-bold text-emerald-400">${avail} Available Beds</span>
                </div>
                <div class="w-full h-2 rounded-full bg-slate-800 overflow-hidden">
                  <div class="h-full bg-amber-500 rounded-full" style="width: ${pct}%"></div>
                </div>
              </div>

              <div class="text-[11px] text-slate-400 bg-slate-900/80 p-2.5 rounded border border-slate-800 flex justify-between items-center">
                <span>Features: ${s.accessibilityNotes}</span>
                <span class="mono text-slate-300">${s.contactPhone}</span>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        console.error(e);
      }
    }

    async function loadVolunteers() {
      const cont = document.getElementById('volunteer-container');
      try {
        const volunteers = await API.request('/volunteers-shelters/volunteers');
        cont.innerHTML = (volunteers || []).map(v => `
          <div class="panel-card p-4 flex items-center justify-between">
            <div class="space-y-1">
              <div class="text-xs font-bold text-white flex items-center gap-2">
                <span>${v.name}</span>
                <span class="text-[10px] px-2 py-0.5 rounded bg-purple-950 text-purple-300 font-semibold">${v.availabilityStatus}</span>
              </div>
              <div class="text-[11px] text-slate-400">${v.address} • Phone: ${v.phone}</div>
              <div class="flex flex-wrap gap-1 mt-1">
                ${(v.skills || []).map(sk => `<span class="px-1.5 py-0.5 rounded bg-slate-800 text-[9px] text-cyan-300">${sk}</span>`).join('')}
              </div>
            </div>
            <button onclick="alert('Mobilized volunteer for assistance.')" class="px-3 py-1.5 rounded bg-purple-600 hover:bg-purple-500 text-white font-bold text-[10px] transition">
              Mobilize
            </button>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }
  </script>
</body>
</html>
