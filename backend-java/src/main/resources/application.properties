spring.application.name=jeevansetu-backend
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/jeevansetu}
spring.data.mongodb.auto-index-creation=true

# Security / JWT
jeevansetu.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jeevansetu.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Python AI Service
jeevansetu.ai.service-url=${PYTHON_AI_URL:http://localhost:8000}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.com.jeevansetu=INFO
logging.level.org.springframework.security=WARN
